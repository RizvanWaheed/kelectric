<script type="text/javascript">
    $(function () {
        $('#grplistsnotif').slimscroll({
            height: '600px',
            disableFadeOut: true
        }).bind('slimscroll', function (e, pos) {
            if (pos == "bottom") {
                angular.element('#NotificationsController').scope().loadMoreNotifications();
                angular.element('#NotificationsController').scope().$apply();
            }
        });
    });
</script>
