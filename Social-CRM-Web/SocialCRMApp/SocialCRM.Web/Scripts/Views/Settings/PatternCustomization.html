<div class="wrapper">
    <style>
        table tr:nth-child(odd) {
            background-color: #ffffff;
        }

        table tr:nth-child(even) {
            background-color: #f7f7f7;
        }

        .thumb {
            width: 100px;
            height: 100px;
            margin: 5px;
        }
    </style>

    <form name="myForm">
        <div ng-app="CRMApp" class="" ng-controller="PatternCustomizationController">
            <div class="content-wrapper" style="min-height:650px !important;">
                <!-- Content Header (Page header) -->
                <!-- header starts here -->
                <div class="container-fluid page_name">
                    <div class="col-sm-10"><i class="fa fa-flag"></i> Pattern Settings</div>
                </div>
                <div class="container-fluid padding_set">
                    <div class="col-md-12">
                        <div class="box box-default">
                            <!-- /.box-header -->
                            <button type="button" class="btn btn-primary button_round" ng-click="AddPattern()" style="float: right;margin: 15px;">
                                ADD PATTERN
                            </button>
                            <div class="box-body">
                                <table cellspacing="0" cellpadding="0" class="filter_table" style="width: 100%;">
                                    <thead>
                                        <tr>
                                            <th width="25%"  style="border: 1px solid #d2d6de; padding: 5px;text-align: center;">
                                                Pattern
                                            </th>
                                            <th width="55%"  style="border: 1px solid #d2d6de; padding: 5px;text-align: center;">
                                                Regex
                                            </th>
                                            <th width="10%"  style="border: 1px solid #d2d6de; padding: 5px;text-align: center;">
                                                Status
                                            </th>
                                            <th width="10%"  style="border: 1px solid #d2d6de; padding: 5px;text-align: center;">
                                                Actions
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in Patterns">
                                            <td style="border: 1px solid #d2d6de; padding: 5px;">
                                                {{item.RegexFor}}
                                            </td>
                                            <td style="border: 1px solid #d2d6de; padding: 5px;">
                                                {{item.Pattern}}
                                            </td>
                                            <td style="border: 1px solid #d2d6de; padding: 5px;text-align: center;">
                                                <input type="radio" ng-model="$parent.PatternVal" ng-value="{{item.IsActive}}" ng-change="SelectedPatternChange(item.Id)" name="test" />
                                            </td>
                                            <td style="border: 1px solid #d2d6de; padding: 5px;text-align: center;">
                                                <a id="edit-pattern" href="javascript:" ng-click="EditPattern(item)">Edit</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div><!-- /.box-body -->
                        </div><!-- /.box -->
                    </div>

                    <div>
                        <button type="button" class="btn btn-primary button_round  btn_height3" ng-disabled="myForm.$invalid " ng-click="Save()" style="margin-left:15px;">
                            SAVE CHANGES
                        </button>
                        <button type="button" class="btn btn-primary button_round  btn_height3" ng-click="DisablePattern()" style="margin-left:15px;">
                            DISABLE ALL PATTERNS
                        </button>
                    </div>
                </div>


                <!-- Main content -->
                <!-- /.content -->
            </div><!-- /.content-wrapper -->
        </div>
    </form>
</div>
<div ui-view="Footer"></div>
