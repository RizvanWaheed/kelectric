<div class="wrapper">
    <style>
        input[type=checkbox] {
            visibility: visible;
        }

        .error{
            color:#ff0000;
        }

        .save, .cancel {
            display:none;
        }

        .green{
            color:green;
        }
    </style>

    <div ng-app="CRMApp" class="" ng-controller="UserLogsController">
        <div class="content-wrapper" style="min-height:650px !important;">
            <!-- Content Header (Page header) -->
            <!-- header starts here -->
            <div class="container-fluid page_name">
                <div class="col-sm-10"><i class="fa fa-user"></i> User Logs</div>
            </div>
            <div class="container-fluid padding_set">
                <div class="col-md-12">
                    <div class="box box-default" style="margin-bottom:0px;">
                        <div class="box-body">
                            <div class="col-md-12 zro_left">
                                <table class="table-striped" style="width:100%;">
                                    <tr>
                                        <th style="padding:5px;">User Name</th>
                                        <th>Email</th>
                                        <th>Ip Address</th>
                                        <th>Action</th>
                                        <th>Action Date</th>
                                    </tr>
                                    <tr ng-repeat="log in userLogs">
                                        <td>{{log.UserName}}</td>
                                        <td>{{log.Email}}</td>
                                        <td>{{log.IpAddress}}</td>
                                        <td>{{log.LogAction}}</td>
                                        <td>{{log.LogActionDate}}</td>
                                       
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Main content -->
            <!-- /.content -->
        </div><!-- /.content-wrapper -->
    </div>
</div>
<div ui-view="Footer"></div>
