<style>
    .slider {
        width: 100%;
        height: 400px;
        overflow: hidden;
        position: relative;
        background: #e6e6e6;
        border-right: 15px solid #FFF;
        border-left: 15px solid #FFF;
        border-top: 15px solid #FFF;
        border-bottom: 15px solid #FFF;
    }

    .slide {
        position: absolute;
        top: 0;
        left: 0;
    }

    .arrow {
        position: absolute;
        z-index: 1002;
        display: block;
        top: 50%;
        margin-top: -35px;
        width: 36px;
        height: 71px;
        outline: none;
        cursor: pointer;
        background: url(../../../Content/img/blank.gif) no-repeat;
    }

        .arrow.prev {
            opacity: 0.2;
            left: 20px;
            background-image: url(../../../Content/img/paddle_prev_999.png);
            transition: 0.2s linear all;
        }

        .arrow.next {
            opacity: 0.2;
            right: 20px;
            background-image: url(../../../Content/img/paddle_next_999.png);
            transition: 0.2s linear all;
        }

        .arrow.prev:hover {
            opacity: 1;
            background-image: url(../../../Content/img/paddle_prev_fff.png);
        }

        .arrow.next:hover {
            opacity: 1;
            background-image: url(../../../Content/img/paddle_next_fff.png);
        }



    /*---------------------------------------------------------
    NAV
    ---------------------------------------------------------*/

    .slider > .nav {
        text-align: center;
        display: block;
        position: absolute;
        z-index: 1002;
        left: 0;
        bottom: -4px;
        right: 0;
        height: 48px;
    }

    .navbar-slider {
        border-right: 15px solid #FFF;
        border-left: 15px solid #FFF;
    }

        .navbar-slider > .nav .wrapper {
            margin: 0 auto;
            width: 100%;
            padding: 1em 0 .8em;
        }

        .navbar-slider > .nav ul {
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        .navbar-slider > .nav .dot, .nav .dot a {
            display: inline-block;
            zoom: 1;
        }

    .dots .dot {
        position: relative;
        margin: 0 8px;
        width: 12px;
        height: 12px;
    }

        .dots .dot a {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 6px;
            height: 6px;
            text-indent: 100%;
            white-space: nowrap;
            overflow: hidden;
            background: #FFF;
            border: 1px solid transparent;
            outline: none;
            -webkit-box-shadow: none;
            -moz-box-shadow: none;
            box-shadow: none;
            -webkit-border-radius: 50%;
            -moz-border-radius: 50%;
            border-radius: 50%;
            -webkit-transition: background-color 0.25s, border-color 0.25s;
            -moz-transition: background-color 0.25s, border-color 0.25s;
            transition: background-color 0.25s, border-color 0.25s;
        }

            .dots .dot a.active {
                border-color: #FFF;
                background-color: transparent;
            }
</style>
<div class="modal-content" style="padding-top:0px;">
    <div class="modal-header" style="padding:7px; padding-left:30px;">
        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()">&times;</button>
        <h4 class="modal-title"><i class="fa fa-mail-reply"></i>Media</h4>
    </div>
    <div class="modal-body" style="overflow:hidden; padding-top:3px;">
        <div class="container slider">
            <div id="fb-root"></div>
            <div ng-repeat="slide in Attachments">
                <!--<img class="slide slide-animation nonDraggableImage img-responsive"
                     ng-swipe-right="nextSlide()" ng-swipe-left="prevSlide()"
                     ng-hide="!isCurrentSlideIndex($index)" ng-src="{{slide.Url}}" style="height: 100%;width: 100%;">
                <iframe class="slide slide-animation nonDraggableImage img-responsive" ng-swipe-right="nextSlide()" ng-swipe-left="prevSlide()"
                        ng-hide="!isCurrentSlideIndex($index)" id="player_1" src="http://fast.wistia.com/embed/iframe/t4yniozocs?controlsVisibleOnLoad=true&playerColor=474745&version=v1&videoHeight=366&videoWidth=650&volumeControl=true&videoFoam=true" allowtransparency="true" frameborder="0" scrolling="no" class="wistia_embed" name="wistia_embed" width="650" height="366"></iframe>-->
                <img ng-if="slide.Type == 'image'" ng-src="{{slide.Url}}" style="border-radius: 0px;width:100%;height:100%; object-fit:contain" class="slide slide-animation nonDraggableImage"
                     ng-hide="!isCurrentSlideIndex($index)" />
                <iframe ng-if="slide.Type == 'video_share'" src="{{slide.Url}}" style="border-radius: 0px;max-width:100%;max-height:100%;object-fit:contain" class="slide slide-animation nonDraggableImage"
                        ng-hide="!isCurrentSlideIndex($index)" 
                        allowtransparency="true" frameborder="0" scrolling="no" name="wistia_embed" width="570" height="400"></iframe>
                <iframe ng-if="slide.Type == 'video_fb'" src="{{slide.Url}}"  style="border-radius: 0px;max-width:100%;max-height:100%;object-fit:contain" class="slide slide-animation nonDraggableImage"
                        ng-hide="!isCurrentSlideIndex($index)" width="570" height="400"
                        scrolling="no" frameborder="0" allowTransparency="true"></iframe>
            </div>
            <a class="arrow prev" href="javascript:" ng-click="nextSlide()"></a>
            <a class="arrow next" href="javascript:" ng-click="prevSlide()"></a>
        </div>
        <div class="navbar-slider">
            <nav class="nav">
                <div class="wrapper" style="background-color: #435664 !important;">
                    <ul class="dots">
                        <li class="dot" ng-repeat="slide in Attachments">
                            <a href="javascript:" ng-class="{'active':isCurrentSlideIndex($index)}"
                               ng-click="setCurrentSlideIndex($index);"></a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>

    </div>

</div>
