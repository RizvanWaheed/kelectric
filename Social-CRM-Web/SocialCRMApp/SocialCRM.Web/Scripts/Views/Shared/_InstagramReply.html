<div class="modal-content" style="padding-top:0px;">
    <div class="modal-header" style="padding:7px; padding-left:30px;">
        <div class="insta_social_icos" ng-if="MessageType=='IM' || MessageType=='IC'"></div>
        
        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()">&times;</button>
        <h4 class="modal-title"><i class="fa fa-mail-reply"></i> {{FormText}}</h4>
    </div>
    <div class="modal-body" style="height:550px; overflow:hidden; padding-top:3px;">

        <div id="scrollerDiv">

            <div id="selectPostingProfile" class="collapse col-md-12 zro">
                <!--div of profiles-->
                <div style="margin-bottom:10px " id="pop_sprof" slimscroll="slim" class="box box-default filter_box ng-scope">
                    <table class="table table-condensed">
                        <tr ng-repeat="profile in attachedProfiles">
                            <td>
                                <img src="{{profile.ProfilePicURL}}" alt="" border="0" class="img_con img_con_height"><span class="soc_name">
                                    {{profile.Name}}<br>
                                    <p><img ng-src="{{ (MessageType == 'IM' || MessageType == 'IC') && '/Content/images/insta_ico16.png'}}" alt="linkedin-profile"> @{{profile.UserName}}</p>
                                </span>
                            </td>
                            <td align="center" valign="middle">
                                <div class="squaredSmall" style="margin-top:13px;">
                                    <input type="checkbox" value="None" id="profile-{{profile.Id}}" name="check" ng-click="CheckProfile(profile.Id,profile.UserName,profile.IsPage,profile.ProfileExternalId, profile.ProfilePicURL);" ng-checked="{{profile.ischecked}}" />
                                    <label for="profile-{{profile.Id}}"></label>
                                    <span></span>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>           

            <!--Instagram Post Detail-->
            <div ng-if="MessageType=='IM' || MessageType=='IC'" class="col-md-12 zro_left">
                <div class="col-md-3 zro" style="margin-bottom:5px; margin-top:0px;">
                    <img ng-if="IsImage == true" src="{{MessageItself}}" height="150" width="150" class="img-thumbnail img_margin" style="border-radius:0%; object-fit: cover;">
                    <video ng-if="IsImage == false" class="img-thumbnail img_margin" width="160" controls>
                        <source ng-src="{{getVideoURL()}}" type="video/mp4">
                        Your browser does not support HTML5 video.
                    </video>
                    <!--
                    <video ng-if="IsImage == false" controls height="294" width="150" class="img-thumbnail img_margin"><source ng-src="VideoURL"></video>-->                   
                </div>
                <div class="col-md-9 zro">
                    <div class="col-md-12">
                        <div class="col-md-2 zro">
                            <div class="inbox_blk inbox_blk_img" style="border-color:transparent; padding-top:0px; margin-top:-2px; margin-bottom:0px !important; width:50px; height:35px;">
                                <a href="javascript:;"><img src="{{PostAuthorProfilePic}}" onerror="this.onerror = null; this.src = 'Content/img/user2.jpg';" alt="User Image" class="img-circle img-responsive"></a>
                            </div>
                        </div>
                        <div class="col-md-10">
                            <h5><strong>{{PostAuthor}}</strong>&nbsp;</h5>
                        </div>
                        <div class="col-md-12 zro_left" style="border-top:1px solid #ccc; padding-top:10px;">
                            <span class="inbox_blk_cred">{{MessagePostDateTime}}</span>
                        </div>
                    </div>
                    <div class="col-md-12">
                        {{Caption}}
                    </div>
                </div>
            </div>

            <!--Reply Box-->
            <div class="col-md-12 zro">
                <div class="col-sm-12 zro" style="padding:0px;">
                    <div class="col-sm-1" style="padding:0px;">
                        <div class="inbox_blk inbox_blk_img" style="border-color:transparent; padding-top:0px; margin-top:-2px; margin-left:8px; padding-left:5px; margin-bottom:0px !important; width:50px; height:35px;">
                            <a href="javascript:;"><img src="{{MessagePostUserImageUrl}}" alt="User Image"></a>
                        </div>
                    </div>
                    <div class="col-sm-11 text-left inbox_blk_msg_blk">
                        <textarea maxlength="{{totalConversation}}" ng-maxlength="{{totalConversation}}" ng-show="IsEnable" ng-model="replyedMsgModel" name="" cols="" rows="1" class="form-control input_border_min input_login_h" style="max-width:500px; margin-bottom:8px " aria-describedby="sizing-addon2" placeholder="Type a comment..."> </textarea>
                    </div>
                </div>
                <!--Settings Panel-->
                <div class="col-sm-12 zro_left" style="margin-bottom:10px;">
                    <div class="col-sm-6 zro_left">
                        <!--Profiles Modal-->
                        <button type="button" data-toggle="collapse" data-target="#selectPostingProfile" class="btn btn-xs btn-primary button_round" style="margin-top:5px;"><i class="fa fa-user"></i> Select Profile</button>
                        <button ng-if="MessageType=='IM' || MessageType=='IC'" type="button" class="btn btn-xs btn-primary button_round" style="margin-top:5px;" ng-click="AddInstagramComment(replyedMsgModel)">
                            <span><i class="fa fa-comment"></i> Comment</span>
                        </button>                        
                    </div>
                    <div class="col-sm-6" ng-show="IsEnable"><strong style="float:right; font-size:9px;"><em>{{totalConversation - replyedMsgModel.length}}/{{totalConversation}}</em></strong></div>
                </div>
            </div>

            <!--Comment Area Start-->
            <div id="pop_vhis" slimscroll="commentsLength">                 
                <!--Instagram Comments-->
                <div class="col-sm-12 inbox_blk unread_msg" ng-if="MessageType=='IM' || MessageType=='IC'" ng-repeat="comment in inboxHistoryItemDetails" style="margin-bottom:0px !important; padding:0px; margin-top:4px; clear:both">
                    <div class="col-sm-1">
                        <div class="inbox_blk_img" style="width:35px; height:35px;">
                            <a href="javascript:;"><img src="{{comment.FromProfilePicture}}" onerror="this.onerror = null; this.src = 'Content/img/user2.jpg';" alt="User Image" class="img-circle img-responsive"></a>
                        </div>
                    </div>
                    <div class="col-sm-11 text-left inbox_blk_msg_blk">
                        <div class="inbox_blk_msg">
                            <a href="javascript:;"><strong>{{comment.FromUserName}}</strong></a> {{comment.Message}}
                            <div class="inbox_blk_cred">
                                {{getTimeDifference(comment.CreatedDate)}}
                            </div>
                        </div>
                    </div>
                </div>                                          
            </div>
                        
            <!--<div id="pop_insta" slimscroll="InstaComments" ng-show="MessageType=='IM' || MessageType=='IC'">
                                       
            </div>-->
            <!--Comment Area End-->
        </div>
    </div>

</div>
