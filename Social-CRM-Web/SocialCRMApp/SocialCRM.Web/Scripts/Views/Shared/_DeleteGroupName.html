<!-- Modal for retweet-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" ng-click="cancel()">&times;</button>
                <h4 class="modal-title"><i class="fa fa-folder-open"></i> DELETE {{GroupName}} Group</h4>
            </div>
            <div class="modal-body">
                <div style="margin-bottom:8px;">Are you sure you want to Delete {{GroupName}} ?</div>
                <div style="margin-top:20px">
                    <button type="button" class="btn btn-primary button_round  btn_height3" ng-click="Delete()">YES</button>
                    <button type="button" class="btn btn-cancel button_round  btn_height3" ng-click="cancel()">CANCEL</button>
                </div>
            </div>
        </div>
