   <!-- Modal for existing profile content-->
    <div class="modal-dialog">
        <style>
            table tr:nth-child(odd) {
                background-color: #ffffff;
            }

            table tr:nth-child(even) {
                background-color: #f7f7f7;
            }

            .thumb {
                width: 100px;
                height: 100px;
                margin: 5px;
            }
        </style>
        <!-- Modal for New Group content-->
        
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" ng-click="cancel()">&times;</button>
                <h4 class="modal-title"><i class="fa fa-user"></i> ENGAGE EXISTING TEAM MEMBER(S)</h4>
            </div>
            <div class="modal-body">
                <div id="soclists" style="margin-top:10px;" slimscroll="slim">
                    <table class="table table-condensed">
                        <tr>
                            <th colspan="2" class="td_styler"><i class="fa fa-user"></i> USER'S PROFILES</th>

                            <th style="width: 100px; text-align:center" class="td_styler"></th>
                        </tr>

                        <tr ng-repeat="x in Connected_Profiles">
                            <td width="15%">
                                <img class="img-circle img-responsive" src="/Content/img/user2.jpg" alt="" border="0" class="img_con img_con_height">
                            </td>
                            <td width="75%" align="left">
                                <span class="soc_name">
                                    {{x.Name}}<br>
                                    <p>
                                        {{ x.Email }}
                                    </p>
                                </span>
                            </td>

                            <td align="center" valign="middle" width="10%">
                                <div class="squaredSmall" style="margin-top:13px;">
                                    <input type="checkbox" value="None" id="{{x.TeamMemberId}}profile" name="check" ng-model="selected[x.TeamMemberId]" />
                                    <label for="{{x.TeamMemberId}}profile"></label>
                                </div>
                            </td>
                        </tr>

                        
                    </table>
                </div>
                <p class=" warnings_p f_warning" ng-show="ErrorShow">{{ErrorMessage}}</p>
                <div><button type="button" class="btn btn-primary button_round  btn_height3" style="margin-top:25px;" ng-click="AddProfile()">+ ADD MEMBER(S)</button></div>
            </div>

        </div>

 
<!-- Modal for existing profile content-->
