<div class="modal-content">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" ng-click="Cancel()">&times;</button>
        <h4 class="modal-title"><i class="fa fa-check"></i> {{ErrorTitle}}</h4>
    </div>
    <div class="modal-body">


        <div style="margin-bottom:8px;">{{ErrorMessage}}</div>

        <!--<input style="display:none;" id="sample" type="text" ng-keydown='checkKeyCode($event)'>-->

        <div style="margin-top:20px">
            <button type="button" class="btn btn-primary button_round  btn_height3" autofocus ng-click="OK()">OK</button>
            <button type="button" class="btn btn-primary button_round  btn_height3" ng-click="Cancel()">CANCEL</button>
        </div>
    </div>

</div>
